spring.application.name=modern-banking-backend
server.port=8080

# SQLite database file (relative paths resolve against the directory the app is started from: modern/backend).
# Build it first with modern/database/init.sh. Override with BANK_DB_PATH or -Dbank.db.path=...
bank.db.path=${BANK_DB_PATH:../database/modernbank.db}

# Allowed browser origin(s) for the React dev server
bank.cors.allowed-origins=${BANK_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Never leak stack traces or internal messages in error responses
server.error.include-stacktrace=never
server.error.include-message=never
spring.mvc.problemdetails.enabled=false
